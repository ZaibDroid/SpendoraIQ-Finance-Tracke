name: spendora_iq
description: A production-level offline SpendoraIQ with AI features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  share_plus: ^13.1.0
  cross_file: ^0.3.5+2
  fluttertoast: ^9.1.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_path: "assets/icons/app-icon.png"
  image_path: "assets/icons/app-icon.png"
  min_sdk_android: 21
